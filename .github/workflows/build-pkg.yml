name: Build PKG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wallpaper
        uses: actions/checkout@v4

      - name: Prepare package input
        run: |
          mkdir pkginput
          cp -r effects fonts materials models particles shaders scene.json pkginput/

      - name: Build PKG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          root = Path("pkginput")
          files = sorted(p for p in root.rglob("*") if p.is_file())
          magic = b"PKGV0024"

          entries = []
          for p in files:
              name = p.relative_to(root).as_posix()
              data = p.read_bytes()
              entries.append((name, data))

          header = bytearray()
          header += struct.pack("<I", len(magic))
          header += magic
          header += struct.pack("<I", len(entries))

          offset = 0
          for name, data in entries:
              nb = name.encode("utf-8")
              header += struct.pack("<I", len(nb))
              header += nb
              header += struct.pack("<ii", offset, len(data))
              offset += len(data)

          out = Path("scene.pkg")
          with out.open("wb") as f:
              f.write(header)
              for _, data in entries:
                  f.write(data)

          raw = out.read_bytes()
          assert raw[:4] == struct.pack("<I", 8)
          assert raw[4:12] == magic
          print("PKG magic:", raw[4:12])
          print("Files:", len(entries))
          print("PKG size:", len(raw))
          PY

      - name: Verify PKG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          p = Path("scene.pkg")
          data = p.read_bytes()
          pos = 0

          magic_len = struct.unpack_from("<I", data, pos)[0]
          pos += 4
          magic = data[pos:pos + magic_len]
          pos += magic_len
          assert magic == b"PKGV0024"

          count = struct.unpack_from("<I", data, pos)[0]
          pos += 4

          entries = []
          for _ in range(count):
              nlen = struct.unpack_from("<I", data, pos)[0]
              pos += 4
              name = data[pos:pos + nlen].decode("utf-8")
              pos += nlen
              offset, size = struct.unpack_from("<ii", data, pos)
              pos += 8
              entries.append((name, offset, size))

          body_start = pos
          for name, offset, size in entries:
              assert body_start + offset + size <= len(data), name

          print("Verified PKGV0024")
          print("Entries:", count)
          print("Header:", body_start, "bytes")
          print("Body:", len(data) - body_start, "bytes")
          PY

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: scene-pkg
          path: scene.pkg
          if-no-files-found: error
